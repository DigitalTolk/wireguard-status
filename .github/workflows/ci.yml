name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write # upload coverage to GitHub Code Quality
      pull-requests: read # let push builds resolve the PR to comment on
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Coverage is measured over ./internal/... (all the real logic);
      # cmd/wg-status is a thin main() shim that only wires signals to
      # internal/app.Run and is deliberately excluded.
      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./internal/...

      # GitHub Code Quality ingests Cobertura XML, so convert Go's profile.
      - name: Convert coverage to Cobertura XML
        run: go run github.com/boumenot/gocover-cobertura@latest < coverage.out > coverage.xml

      # Upload to GitHub's native code coverage; results appear in the UI and
      # as a github-code-quality[bot] PR comment vs the default branch.
      # Requires "Code Quality" to be enabled in the repository settings.
      - name: Upload coverage to GitHub Code Quality
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage.xml
          language: Go
          label: code-coverage/go

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Build the image to prove the Dockerfile stays green on every PR and on
      # main. Publishing happens on tags via the release workflow, so nothing
      # is pushed here.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
