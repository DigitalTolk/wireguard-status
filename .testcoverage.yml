# Coverage gate for go-test-coverage (https://github.com/vladopajic/go-test-coverage).
# The whole codebase is held to 100% — every file, package, and the total. No
# `// coverage-ignore` overrides are used; the profile is generated from
# ./internal/... only, since cmd/wg-status is a thin, untestable main() shim.
profile: coverage.out

threshold:
  file: 100
  package: 100
  total: 100
