# wg-status configuration — WireGuard-style INI.
# Same look & feel as wgX.conf: [Sections] with "Key = Value" lines.
# Comments are whole-line only (start with '#' or ';'), exactly like wg-quick —
# values are taken verbatim. A missing file is fine (defaults + env are used).
#
# Every interface and peer reported by WireGuard is discovered automatically and
# monitored — there is no per-peer or per-interface configuration.

[Server]
Listen       = :8600
# Collector: "wg" (real, via the WireGuard netlink API) or "fake" (demo).
Collector    = wg
PollInterval = 10s
# Optional HTTPS: set both to PEM file paths to serve over TLS.
# TLSCert = /etc/wg-status/tls/cert.pem
# TLSKey  = /etc/wg-status/tls/key.pem

[Auth]
Username = admin
# Generate with:  printf '%s' 'your-password' | wg-status -hash-password
# The hash below is for "CHANGE-ME" — replace it.
PasswordHash = pbkdf2-sha256$210000$HzzA8nLwclC/l2Cnv4MUqw$mK88MyXGamXMyOB6sBHiMViUrcztpFu8UVcOYJENtQ4

[Monitor]
# A peer is "down" once its last handshake is older than this.
HandshakeStale = 180s
